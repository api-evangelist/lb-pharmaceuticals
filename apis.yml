aid: lb-pharmaceuticals
name: LB Pharmaceuticals
description: 'LB Pharmaceuticals Inc (Nasdaq: LBRX) is a clinical-stage biopharmaceutical
  company headquartered at One Pennsylvania Plaza, New York, developing novel therapies
  for neuropsychiatric diseases including schizophrenia and bipolar depression. Its
  lead asset, LB-102, is an oral small-molecule benzamide antipsychotic with potent
  D2, D3 and 5HT7 antagonism, positioned to become the first benzamide antipsychotic
  approved for neuropsychiatric disorders in the United States. The company reported
  positive Phase 2 schizophrenia results from its NOVA1 trial in January 2025 and
  initiated the ILLUMINATE-1 Phase 2 bipolar depression trial in January 2026. LB
  Pharmaceuticals is a drug developer, not a software vendor: it publishes no public
  API, developer portal, SDK or machine-readable contract, and its web presence is
  a WordPress corporate and investor-relations site.'
